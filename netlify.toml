[build]
  publish = "site"
  command = ""

# The landing page hub moved to /services/
[[redirects]]
  from = "/web-design"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/web-design/"
  to = "/services/"
  status = 301

# Self-hosted fonts never change under the same name, so browsers can keep them
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
